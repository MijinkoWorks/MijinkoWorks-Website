# main に push されたら src/ の中身をそのまま GitHub Pages に公開する。
# ビルド工程は無い（静的 HTML / CSS / JS）。手動実行も可（Actions タブの "Run workflow"）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload src/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
